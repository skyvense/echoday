name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships an Android SDK; setup-android@v3 breaks on
      # current cmdline-tools (it tries to install the removed 'tools'
      # package), so install the two needed packages directly.
      - name: Install platform 34 and build-tools 34.0.0
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Inject signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_INFO: ${{ secrets.KEYSTORE_INFO }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_INFO" ]; then
            echo "::error::KEYSTORE_B64 / KEYSTORE_INFO secrets are not set"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > muse-recorder.keystore
          printf '%s' "$KEYSTORE_INFO" > keystore-info.txt

      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ./build-apk.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: echoday-apk
          path: android/EchoDay.apk

      - name: Publish release asset (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp EchoDay.apk "EchoDay-${{ github.ref_name }}.apk"
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes "EchoDay ${{ github.ref_name }}"
          gh release upload "${{ github.ref_name }}" "EchoDay-${{ github.ref_name }}.apk" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
