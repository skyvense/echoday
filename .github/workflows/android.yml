name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform 34 and build-tools 34.0.0
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Inject signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_INFO: ${{ secrets.KEYSTORE_INFO }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_INFO" ]; then
            echo "::error::KEYSTORE_B64 / KEYSTORE_INFO secrets are not set"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > muse-recorder.keystore
          printf '%s' "$KEYSTORE_INFO" > keystore-info.txt

      - name: Build APK
        run: ./build-apk.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: echoday-apk
          path: android/MuseRecorder.apk

      - name: Publish release asset (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/MuseRecorder.apk
