# Host network. Use this when dockerd was started with --iptables=false.
# Web: 0.0.0.0:8080   API: 127.0.0.1:8787   Postgres and object storage stay on 127.0.0.1.
# Optional bridge networking (published web port 8471) is docker-compose.bridge.yml.

services:
  postgres:
    image: postgres:16-alpine
    network_mode: host
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-muse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-muse_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-muse}
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    volumes:
      - muse_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-muse} -d ${POSTGRES_DB:-muse}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    # Official minio/minio images are no longer published. Silo is S3-compatible.
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    network_mode: host
    command: server /data --address 127.0.0.1:9000 --console-address 127.0.0.1:9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-museadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-museadmin-secret}
    volumes:
      - muse_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  api:
    build: ./api
    network_mode: host
    env_file: .env
    environment:
      API_HOST: 127.0.0.1
      API_PORT: 8787
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-muse}:${POSTGRES_PASSWORD:-muse_dev_password}@127.0.0.1:5432/${POSTGRES_DB:-muse}
      S3_ENDPOINT: http://127.0.0.1:9000
      STORAGE_DIR: /data
    volumes:
      - muse_blobs:/data
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  web:
    build: ./web
    network_mode: host
    environment:
      NGINX_PORT: "8080"
      API_UPSTREAM: http://127.0.0.1:8787
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  muse_pg:
  muse_minio:
  muse_blobs:
