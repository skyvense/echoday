# Optional bridge compose. Web is published on host port 8471.
# The default docker-compose.yml uses host networking (web 8080, API 8787)
# for machines whose dockerd was started with --iptables=false.
# When you use this file, set PUBLIC_URL=http://127.0.0.1:8471 if the override below is removed.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-muse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-muse_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-muse}
    volumes:
      - muse_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-muse} -d ${POSTGRES_DB:-muse}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-museadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-museadmin-secret}
    volumes:
      - muse_minio:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  api:
    build: ./api
    env_file: .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8787
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:8471}
      DATABASE_URL: postgres://${POSTGRES_USER:-muse}:${POSTGRES_PASSWORD:-muse_dev_password}@postgres:5432/${POSTGRES_DB:-muse}
      S3_ENDPOINT: http://minio:9000
      STORAGE_DIR: /data
    volumes:
      - muse_blobs:/data
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  web:
    build: ./web
    environment:
      NGINX_PORT: "80"
      API_UPSTREAM: http://api:8787
    ports:
      - "8471:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  muse_pg:
  muse_minio:
  muse_blobs:
