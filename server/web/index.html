<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="EchoDay records your whole day and your AI agent turns it into memory — searchable transcripts, a daily summary, and photo stories. Never fear forgetting again."
    />
    <title>EchoDay</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("muse-theme");
          if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
