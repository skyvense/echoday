<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="Muse AI Cloud keeps all-day recordings, event markers, and the daily summary. Transcription stays on your own keys."
    />
    <title>Muse AI Cloud</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("muse-theme");
          if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
